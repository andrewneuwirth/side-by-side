<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F7BFF"/>
      <stop offset="1" stop-color="#2A3FD6"/>
    </linearGradient>
    <linearGradient id="skyL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#FF8F6B"/>
    </linearGradient>
    <linearGradient id="skyR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FE3FF"/>
      <stop offset="1" stop-color="#5CB8F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1570" flood-opacity="0.35"/>
    </filter>
    <clipPath id="clipL"><rect x="222" y="322" width="266" height="340" rx="22"/></clipPath>
    <clipPath id="clipR"><rect x="536" y="322" width="266" height="340" rx="22"/></clipPath>
  </defs>

  <!-- macOS-style rounded square (824pt body on a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="4"/>

  <g transform="translate(0,-36)">
  <!-- left photo: sunset -->
  <g filter="url(#shadow)">
    <rect x="200" y="300" width="310" height="384" rx="36" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#clipL)">
    <rect x="222" y="322" width="266" height="340" fill="url(#skyL)"/>
    <circle cx="400" cy="440" r="42" fill="#FFF4D6"/>
    <path d="M222 662 L222 560 L300 480 L370 548 L420 506 L488 574 L488 662 Z" fill="#7A3E8F"/>
    <path d="M222 662 L222 604 L320 548 L400 600 L488 566 L488 662 Z" fill="#4E2A6E"/>
  </g>

  <!-- right photo: daytime -->
  <g filter="url(#shadow)">
    <rect x="514" y="300" width="310" height="384" rx="36" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#clipR)">
    <rect x="536" y="322" width="266" height="340" fill="url(#skyR)"/>
    <circle cx="610" cy="412" r="34" fill="#FFFFFF"/>
    <path d="M536 662 L536 570 L620 494 L690 560 L740 516 L802 578 L802 662 Z" fill="#2FA36B"/>
    <path d="M536 662 L536 612 L640 566 L720 614 L802 588 L802 662 Z" fill="#1E7A4F"/>
  </g>

  <!-- merge arrow badge -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="760" r="74" fill="#FFFFFF"/>
  </g>
  <path d="M512 718 L512 790 M480 760 L512 794 L544 760" fill="none" stroke="#2A3FD6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
